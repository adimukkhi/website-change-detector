services:
  - type: web
    name: website-change-detector
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: website-change-detector-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_DIGEST_HOUR
        value: "8"
      - key: COOKIE_SECURE
        value: "true"
      - key: START_SCHEDULER
        value: "true"
      - key: SCREENSHOT_DIR
        value: /var/data/screenshots
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    disk:
      name: website-change-detector-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: website-change-detector-db
    plan: free
